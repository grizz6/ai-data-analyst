name: Deploy to Hugging Face Spaces

# Runs after CI passes on main, so only tested code goes live. Can also be
# started by hand from the Actions tab.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-space
  cancel-in-progress: true

jobs:
  deploy:
    name: Push to the Space
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      # Repository variable, e.g. "your-hf-username/ai-data-analyst".
      HF_SPACE: ${{ vars.HF_SPACE }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Check the settings
        run: |
          if [ -z "$HF_SPACE" ] || [ -z "$HF_TOKEN" ]; then
            echo "::error::Set the HF_SPACE repository variable (owner/space) and the HF_TOKEN secret under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Prepare the Space files
        run: |
          mkdir space
          git archive HEAD | tar -x -C space
          cd space
          # Spaces read their settings from a header at the top of README.md.
          # It's added only here, so the README on GitHub stays clean.
          {
            printf -- '---\n'
            printf 'title: AI Data Analyst\n'
            printf 'emoji: 📊\n'
            printf 'colorFrom: blue\n'
            printf 'colorTo: indigo\n'
            printf 'sdk: docker\n'
            printf 'app_port: 8000\n'
            printf 'pinned: false\n'
            printf 'short_description: Quality checks, charts and Q&A for CSV and Excel\n'
            printf -- '---\n\n'
            cat README.md
          } > README.space.md
          mv README.space.md README.md
          # Spaces sit behind one proxy that appends the visitor's address to
          # X-Forwarded-For; trust exactly that entry for the rate limits.
          printf '\nENV ADA_TRUSTED_PROXY_HOPS=1\n' >> Dockerfile
          # The Space doesn't need the tests, CI, or sample-data history.
          rm -rf .github backend/tests

      - name: Push to the Space
        working-directory: space
        run: |
          git init -q -b main
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy $(git -C "$GITHUB_WORKSPACE" rev-parse --short HEAD) from GitHub"
          # Each deploy is one snapshot commit; the full history lives on GitHub.
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
          echo "Deployed to https://huggingface.co/spaces/${HF_SPACE}"
