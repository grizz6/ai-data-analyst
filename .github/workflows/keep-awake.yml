name: Keep awake

# Render's free plan puts the site to sleep after 15 minutes without visitors,
# and waking it takes about a minute. A request every 10 minutes keeps it up.
# GitHub can start scheduled runs a few minutes late, which still fits.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Set a repository variable SITE_URL to point this at another address.
      SITE_URL: ${{ vars.SITE_URL || 'https://ai-data-analyst-xz78.onrender.com' }}
    steps:
      - name: Request the health check
        run: |
          # A sleeping site takes up to about a minute to answer, so allow 90 s
          # and retry a few times before calling it down.
          curl --fail --silent --show-error --max-time 90 \
            --retry 3 --retry-delay 10 --retry-all-errors \
            "$SITE_URL/api/health"
