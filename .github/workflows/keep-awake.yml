name: Keep awake

# Backup only: the app keeps itself awake on Render (backend/app/keep_awake.py).
# GitHub delays and sometimes skips frequent scheduled runs, so this can't be
# relied on alone; it helps wake the site if it ever does fall asleep.
# Minutes 7, 17, 27...: GitHub drops the most runs at the top of the hour.
on:
  schedule:
    - cron: "7-59/10 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Set a repository variable SITE_URL to point this at another address.
      SITE_URL: ${{ vars.SITE_URL || 'https://ai-data-analyst-xz78.onrender.com' }}
    steps:
      - name: Request the health check
        run: |
          # A sleeping site takes up to about a minute to answer, so allow 90 s
          # and retry a few times before calling it down.
          curl --fail --silent --show-error --max-time 90 \
            --retry 3 --retry-delay 10 --retry-all-errors \
            "$SITE_URL/api/health"
